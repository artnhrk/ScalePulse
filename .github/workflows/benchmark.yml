name: Performance Benchmark

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  benchmark:
    runs-on: ubuntu-latest

    env:
      PORT: 6969
      LOG_LEVEL: silent # CRITICAL: avoid log formatting overhead in event loop
      COOKIE_SECRET: ${{ secrets.BENCH_COOKIE_SECRET || 'benchmark-secret-0123456789abcdef0123456789' }}
      DATABASE_URL: postgresql://admin:password123@localhost:5432/scalepulse?schema=public
      REDIS_URI: redis://:password123@localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Generate Prisma Client & Build
        run: |
          npx prisma generate
          npm run build

      - name: Run Benchmark Suite
        run: |
          chmod +x ./scripts/benchmark.sh
          ./scripts/benchmark.sh
