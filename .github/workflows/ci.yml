name: CI

on:
  push:
    branches: [master, development, production]
  pull_request:
    branches: [master, development, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: scalepulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d scalepulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: error
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
      DATABASE_URL: postgresql://admin:password123@localhost:5432/scalepulse?schema=public
      REDIS_URI: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --loglevel=error

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        run: npx prisma migrate deploy

      - name: Check Formatting
        run: npm run format:check

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npm run type:check

      - name: Security Audit
        run: npm run audit:check

      - name: Test Code
        run: npm run test:ci
